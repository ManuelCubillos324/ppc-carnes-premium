<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Validación de Identidad</title>

    <style>

        body{
            background:#111;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .login{
            background:#1f1f1f;
            padding:40px;
            border-radius:15px;
            width:320px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.5);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            color:#00ff88;
        }

        p{
            text-align:center;
            color:#ccc;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:none;
            border-radius:8px;
            outline:none;
            font-size:16px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:green;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#00aa00;
        }

    </style>

</head>

<body>

    <div class="login">

        <h1>Validación de Identidad</h1>

        <p>
            Ingrese sus datos para continuar
        </p>

        <form method="POST">

            <input type="text" name="usuario" placeholder="Usuario">

            <input type="password" name="clave" placeholder="Contraseña">

            <button type="submit">
                Continuar
            </button>

        </form>

    </div>

</body>

</html>
