<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login PPC</title>

    <style>

        body{
            background:#111;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Arial;
        }

        .login{
            background:#1f1f1f;
            padding:40px;
            border-radius:20px;
            width:350px;
            text-align:center;
            box-shadow:0px 0px 20px black;
        }

        h1{
            color:white;
        }

        input{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:none;
            border-radius:10px;
        }

        button{
            width:100%;
            padding:14px;
            margin-top:20px;
            border:none;
            border-radius:10px;
            background:#8B0000;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:red;
        }

        p{
            color:red;
        }

    </style>

</head>

<body>

<div class="login">

    <h1>PPC LOGIN 🔒</h1>

    <form method="POST">

        <input type="text" name="usuario" placeholder="Usuario">

        <input type="password" name="clave" placeholder="Contraseña">

        <button>Entrar</button>

    </form>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

</div>

</body>
</html>
