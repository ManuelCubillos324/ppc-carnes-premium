<div id="aviso-privacidad" class="aviso-privacidad" hidden>
    <div class="contenido-aviso">
        <h3>Privacidad y seguridad</h3>

        <p>
            Este sitio registra la IP pública, ubicación aproximada,
            navegador y tipo de dispositivo con fines de seguridad
            y estadísticas.
        </p>

        <div class="botones-aviso">
            <button
                type="button"
                id="aceptar-analitica"
                class="aceptar"
            >
                Aceptar
            </button>

            <button
                type="button"
                id="rechazar-analitica"
                class="rechazar"
            >
                Rechazar
            </button>
        </div>
    </div>
</div>

<script>
    const aviso = document.getElementById("aviso-privacidad");
    const aceptar = document.getElementById("aceptar-analitica");
    const rechazar = document.getElementById("rechazar-analitica");

    async function registrarVisita() {
        try {
            const respuestaIp = await fetch(
                "https://api.ipify.org?format=json"
            );

            const datosIp = await respuestaIp.json();

            await fetch("/registrar-visita", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    ip: datosIp.ip,
                    ruta: window.location.pathname
                })
            });

        } catch (error) {
            console.warn(
                "No se pudo registrar la visita:",
                error
            );
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        const decision = localStorage.getItem(
            "analitica-mercado-ganadero"
        );

        if (decision === "aceptada") {
            registrarVisita();
            return;
        }

        if (decision === "rechazada") {
            return;
        }

        aviso.hidden = false;
    });

    aceptar.addEventListener("click", function () {
        localStorage.setItem(
            "analitica-mercado-ganadero",
            "aceptada"
        );

        aviso.hidden = true;
        registrarVisita();
    });

    rechazar.addEventListener("click", function () {
        localStorage.setItem(
            "analitica-mercado-ganadero",
            "rechazada"
        );

        aviso.hidden = true;
    });
</script>
